services:
  postgres:
    image: postgres:16-alpine
    container_name: nexamarket-postgres
    environment:
      POSTGRES_DB: nexamarket
      POSTGRES_USER: nexamarket
      POSTGRES_PASSWORD: nexamarket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexamarket -d nexamarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexamarket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexamarket
      RABBITMQ_DEFAULT_PASS: nexamarket
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
