spring.application.name=NexaMarket

# Uygulama Ayarları
server.port=8080

# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=jdbc:postgresql://localhost:5432/nexamarket_db
spring.datasource.username=postgres
spring.datasource.password=Eyup123

# Hibernate ve JPA Ayarları (Tabloları otomatik oluşturur)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
