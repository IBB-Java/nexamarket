spring.application.name=NexaMarket

# Uygulama Ayarları
server.port=8080

# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate ve JPA Ayarları (Tabloları otomatik oluşturur)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT anahtarını üretim ortamında AUTH_JWT_SECRET ile değiştirin.
auth.jwt.secret=${AUTH_JWT_SECRET:VGVzdC1Pbmx5LU5leGFNYXJrZXQtSldULVNlY3JldC1LZXktMzItQnl0ZXMtTWlu}
auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
auth.jwt.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:30d}
auth.login.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-duration=${AUTH_LOCK_DURATION:15m}
