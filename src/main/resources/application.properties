spring.application.name=nexamarket
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket}
spring.datasource.username=${DB_USERNAME:nexamarket}
spring.datasource.password=${DB_PASSWORD:nexamarket}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

auth.jwt.secret=${AUTH_JWT_SECRET:VGVzdC1Pbmx5LU5leGFNYXJrZXQtSldULVNlY3JldC1LZXktMzItQnl0ZXMtTWlu}
auth.jwt.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
auth.jwt.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:30d}
auth.login.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-duration=${AUTH_LOCK_DURATION:15m}

catalog.storage.type=${CATALOG_STORAGE_TYPE:minio}
catalog.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
catalog.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
catalog.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
catalog.storage.bucket=${MINIO_BUCKET:nexamarket-products}
catalog.storage.max-upload-bytes=${CATALOG_IMAGE_MAX_BYTES:5242880}
catalog.search.type=${CATALOG_SEARCH_TYPE:elasticsearch}
catalog.search.indexing.max-delay=${CATALOG_INDEX_MAX_DELAY:5s}
catalog.search.indexing.retry-delay=${CATALOG_INDEX_RETRY_DELAY:250ms}
catalog.search.indexing.max-attempts=${CATALOG_INDEX_MAX_ATTEMPTS:5}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

stock.reservation.duration=${STOCK_RESERVATION_DURATION:PT10M}
stock.reservation.expiration.check-interval-ms=${STOCK_RESERVATION_EXPIRATION_CHECK_INTERVAL_MS:60000}
catalog-service.base-url=${CATALOG_SERVICE_BASE_URL:http://localhost:8080}
order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8080}
cart.reservation-expiration.check-interval-ms=${CART_RESERVATION_EXPIRATION_CHECK_INTERVAL_MS:60000}
order.payment-timeout=${ORDER_PAYMENT_TIMEOUT:PT10M}
order.payment-timeout.check-interval-ms=${ORDER_PAYMENT_TIMEOUT_CHECK_INTERVAL_MS:60000}
payment.polling.interval=${PAYMENT_POLLING_INTERVAL:PT30S}
payment.polling.check-interval-ms=${PAYMENT_POLLING_CHECK_INTERVAL_MS:30000}
payment.mock-provider.callback.check-interval-ms=${MOCK_PROVIDER_CALLBACK_CHECK_INTERVAL_MS:1000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:nexamarket}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:nexamarket}
notification.outbox.check-interval-ms=${NOTIFICATION_OUTBOX_CHECK_INTERVAL_MS:5000}
notification.outbox.retry-delay=${NOTIFICATION_OUTBOX_RETRY_DELAY:PT30S}
notification.delivery.check-interval-ms=${NOTIFICATION_DELIVERY_CHECK_INTERVAL_MS:5000}
notification.retry-delay=${NOTIFICATION_RETRY_DELAY:PT30S}
notification.maximum-attempts=${NOTIFICATION_MAXIMUM_ATTEMPTS:5}
