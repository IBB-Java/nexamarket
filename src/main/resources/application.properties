spring.application.name=nexamarket

# PostgreSQL bağlantısı; değerler ortam değişkenleriyle değiştirilebilir.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket}
spring.datasource.username=${DB_USERNAME:nexamarket}
spring.datasource.password=${DB_PASSWORD:nexamarket}

# Şema değişikliklerini Flyway yönetir; Hibernate yalnızca doğrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Catalog Service, stok rezervasyonlarının tek sahibidir.
catalog-service.base-url=${CATALOG_SERVICE_BASE_URL:http://localhost:8081}
order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8080}

# Süresi dolmuş stok rezervasyonlarının kontrol aralığı (milisaniye).
cart.reservation-expiration.check-interval-ms=${CART_RESERVATION_EXPIRATION_CHECK_INTERVAL_MS:60000}

# Ödeme bekleyen siparişler bu süre sonunda iptal edilir.
order.payment-timeout=${ORDER_PAYMENT_TIMEOUT:PT10M}
order.payment-timeout.check-interval-ms=${ORDER_PAYMENT_TIMEOUT_CHECK_INTERVAL_MS:60000}

# Mock ödeme sağlayıcısı gerçek para hareketi yapmaz; webhook/polling akışını yerelde doğrular.
payment.polling.interval=${PAYMENT_POLLING_INTERVAL:PT30S}
payment.polling.check-interval-ms=${PAYMENT_POLLING_CHECK_INTERVAL_MS:30000}
payment.mock-provider.callback.check-interval-ms=${MOCK_PROVIDER_CALLBACK_CHECK_INTERVAL_MS:1000}
