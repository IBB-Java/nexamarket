spring.application.name=NexaMarket

# Uygulama Ayarları
server.port=8080

# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate ve JPA Ayarları (Tabloları otomatik oluşturur)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
