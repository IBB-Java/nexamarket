spring.application.name=nexamarket

# PostgreSQL bağlantısı; değerler ortam değişkenleriyle değiştirilebilir.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket}
spring.datasource.username=${DB_USERNAME:nexamarket}
spring.datasource.password=${DB_PASSWORD:nexamarket}

# Şema değişikliklerini Flyway yönetir; Hibernate yalnızca doğrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
