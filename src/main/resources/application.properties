spring.application.name=NexaMarket

# Uygulama Ayarları
server.port=8080

# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexamarket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate ve JPA Ayarları (Tabloları otomatik oluşturur)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# S3 uyumlu ürün görseli depolama ayarları
catalog.storage.type=${CATALOG_STORAGE_TYPE:minio}
catalog.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
catalog.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
catalog.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
catalog.storage.bucket=${MINIO_BUCKET:nexamarket-products}
catalog.storage.max-upload-bytes=${CATALOG_IMAGE_MAX_BYTES:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ürün arama indeksi
catalog.search.type=${CATALOG_SEARCH_TYPE:elasticsearch}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
catalog.search.indexing.max-delay=${CATALOG_INDEX_MAX_DELAY:5s}
catalog.search.indexing.retry-delay=${CATALOG_INDEX_RETRY_DELAY:250ms}
catalog.search.indexing.max-attempts=${CATALOG_INDEX_MAX_ATTEMPTS:5}
