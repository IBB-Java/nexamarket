spring.datasource.url=jdbc:h2:mem:nexamarket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.data.elasticsearch.repositories.enabled=false
spring.data.redis.repositories.enabled=false
spring.cache.type=none
stock.lock.type=database
catalog.storage.type=memory
catalog.search.type=memory
catalog.search.indexing.max-delay=2s
catalog.search.indexing.retry-delay=20ms
catalog.search.indexing.max-attempts=5
auth.login.max-failed-attempts=3
auth.login.lock-duration=10m
auth.email-verification.required=false
security.rate-limit.enabled=false
internal.api-key=test-internal-api-key
identity-service.base-url=http://localhost:${local.server.port}
catalog-service.base-url=http://localhost:${local.server.port}
stock-service.base-url=http://localhost:${local.server.port}
order-service.base-url=http://localhost:${local.server.port}
